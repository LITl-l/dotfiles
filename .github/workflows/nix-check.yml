name: Nix Build CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  validate-flake:
    name: Validate Flake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Cachix
        uses: cachix/cachix-action@v14
        with:
          name: nix-community
          skipPush: true

      - name: Show flake metadata
        run: nix flake metadata

      - name: Check flake structure
        run: nix flake show

      - name: Validate flake inputs
        run: nix flake lock --no-update-lock-file

  flake-check:
    name: Flake Checks
    runs-on: ubuntu-latest
    needs: validate-flake
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Cachix
        uses: cachix/cachix-action@v14
        with:
          name: nix-community
          skipPush: true

      # No list of check names appears here, and that is the requirement: every
      # check this flake defines was, until now, run only when a human ran it by
      # hand. `nix flake check` enumerates checks.<system> itself, so a check
      # added to flake.nix is picked up with no edit to this file.
      #
      # A matrix built from `nix flake show --json` would report each check as its
      # own entry in the PR list, which is nicer to read. It was not chosen: it
      # costs a whole extra runner just to enumerate, and then each check's runner
      # re-fetches the closure the checks share -- nixpkgs, nodejs, the neovim
      # wrapper and its plugins. That sharing is free inside one job and paid N
      # times across a matrix, because this repo pushes its own derivations to no
      # cache (the cachix step above is a read-only nix-community pull, skipPush).
      # The existing build-* jobs already show the whole closure arriving from
      # cache.nixos.org in about four minutes, so one job is comfortably cheap and
      # N jobs would be the only version of this that is not.
      - name: Run every check the flake defines
        run: nix flake check --print-build-logs --show-trace

  discover-modules:
    name: Discover Modules
    runs-on: ubuntu-latest
    needs: validate-flake
    outputs:
      modules: ${{ steps.enumerate.outputs.modules }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The matrix below used to name six modules. modules/ holds twelve, so
      # claude-code, hyprland, jujutsu, llama-cpp, pi and yazi had no coverage at
      # all, and a thirteenth module would have arrived with none either.
      - name: Enumerate modules/*.nix
        id: enumerate
        run: |
          modules=$(find modules -maxdepth 1 -name '*.nix' -printf '%f\n' \
            | sed 's/\.nix$//' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')

          # An empty list is not a clean answer: GitHub skips a matrix job whose
          # list is empty and reports the workflow green, which is the same
          # vacuous pass this file is being cured of.
          if [ "$modules" = "[]" ]; then
            echo "❌ modules/ matched no .nix file -- the matrix would have run zero jobs and still reported success"
            exit 1
          fi

          echo "Modules under test: $modules"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  test-modules:
    name: Module ${{ matrix.module }} - parses, imported by home.nix
    runs-on: ubuntu-latest
    needs: [validate-flake, discover-modules]
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover-modules.outputs.modules) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Cachix
        uses: cachix/cachix-action@v14
        with:
          name: nix-community
          skipPush: true

      # The matrix value is a filename out of the branch under test now, not an
      # entry someone typed into this file, so it reaches the shell through the
      # environment rather than through string interpolation.
      - name: Check ${{ matrix.module }} module syntax
        env:
          MODULE: ${{ matrix.module }}
        run: |
          echo "Validating modules/$MODULE.nix"
          nix-instantiate --parse "modules/$MODULE.nix"

      # An "Evaluate module" step used to sit here. It wrote a test-module.nix
      # wrapper and ran `nix-instantiate --eval --strict` on it -- but that file
      # evaluates to a function and --eval does not apply one, so the step printed
      # <LAMBDA>, exited 0, and never imported the module at all. A trailing
      # `|| echo` swallowed any failure besides. Measured here: all twelve modules
      # "passed" it, and so would a module file whose body was `throw "broken"`.
      #
      # Applying the function is not the fix. A Home Manager module evaluated with
      # `config = {}` has no fixpoint to resolve against: measured, 8 of the 12
      # either overflow the stack or hit a missing attribute, none of which is a
      # defect in the module. The real evaluation, against a real config, is what
      # `nix flake check` and the build-* jobs already do -- so this job now
      # asserts the one thing they cannot, that the file is wired in at all.
      - name: Confirm home.nix imports ${{ matrix.module }}
        env:
          MODULE: ${{ matrix.module }}
        run: |
          if ! grep -qF "./modules/$MODULE.nix" home.nix; then
            echo "❌ modules/$MODULE.nix is absent from home.nix's imports list"
            echo "   Nothing evaluates it: no build job and no flake check ever reaches the file."
            exit 1
          fi
          echo "✅ home.nix imports modules/$MODULE.nix"

  build-linux:
    name: Build Linux Configuration
    runs-on: ubuntu-latest
    needs: test-modules
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Cachix
        uses: cachix/cachix-action@v14
        with:
          name: nix-community
          skipPush: true

      - name: Setup dotfiles path for mkOutOfStoreSymlink
        run: |
          sudo mkdir -p /home/nixos/.config/dotfiles/claude
          sudo cp -r claude/* /home/nixos/.config/dotfiles/claude/

      - name: Build user@linux configuration
        run: |
          nix build .#homeConfigurations."user@linux".activationPackage \
            --print-build-logs \
            --show-trace

      - name: Check activation package
        run: |
          if [ ! -L result ]; then
            echo "❌ Build result symlink not found"
            exit 1
          fi
          echo "✅ Build successful: $(readlink result)"

  build-wsl:
    name: Build WSL Configuration
    runs-on: ubuntu-latest
    needs: test-modules
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Cachix
        uses: cachix/cachix-action@v14
        with:
          name: nix-community
          skipPush: true

      - name: Setup dotfiles path for mkOutOfStoreSymlink
        run: |
          sudo mkdir -p /home/nixos/.config/dotfiles/claude
          sudo cp -r claude/* /home/nixos/.config/dotfiles/claude/

      - name: Build user@wsl configuration
        run: |
          nix build .#homeConfigurations."user@wsl".activationPackage \
            --print-build-logs \
            --show-trace

      - name: Verify WSL-specific settings
        run: |
          if [ ! -L result ]; then
            echo "❌ Build result symlink not found"
            exit 1
          fi
          echo "✅ WSL build successful"

  build-nixos-wsl:
    name: Build NixOS WSL Configuration
    runs-on: ubuntu-latest
    needs: test-modules
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Setup Cachix
        uses: cachix/cachix-action@v14
        with:
          name: nix-community
          skipPush: true

      - name: Setup dotfiles path for mkOutOfStoreSymlink
        run: |
          sudo mkdir -p /home/nixos/.config/dotfiles/claude
          sudo cp -r claude/* /home/nixos/.config/dotfiles/claude/

      - name: Build nixos@wsl configuration
        run: |
          nix build .#homeConfigurations."nixos@wsl".activationPackage \
            --print-build-logs \
            --show-trace

      - name: Verify NixOS WSL-specific settings
        run: |
          if [ ! -L result ]; then
            echo "❌ Build result symlink not found"
            exit 1
          fi
          echo "✅ NixOS WSL build successful"

  test-format:
    name: Check Nix Formatting
    runs-on: ubuntu-latest
    needs: validate-flake
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Check formatting
        run: |
          nix fmt -- --check .

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - validate-flake
      - flake-check
      - discover-modules
      - test-modules
      - build-linux
      - build-wsl
      - build-nixos-wsl
      - test-format
    if: always()
    steps:
      - name: Check results
        env:
          # The whole `needs` context, rather than one `needs.<job>.result` line
          # per job. The previous spelling named every job twice -- once in the
          # printed list, once in the gate -- and named only five of the eight in
          # the gate, so three jobs were reported and never enforced. Keeping two
          # hand-written lists in step with the jobs above is the same defect this
          # workflow is being cured of; here the list above is the only edit a new
          # job needs, and it is the one GitHub already requires.
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "CI Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Zero dependencies means the list above was emptied, not that every job
          # passed: the jq below would then select nothing and this job would be
          # green having gated on nothing.
          if [ "$(echo "$NEEDS" | jq -r 'length')" -eq 0 ]; then
            echo "❌ This job depends on no other job, so it checked nothing"
            exit 1
          fi

          # "success" is the only acceptable result, which makes skipped and
          # cancelled failures too: a job skipped because the one it needed failed
          # is a hole, not a pass.
          failed=$(echo "$NEEDS" | jq -r '
            to_entries[] | select(.value.result != "success") | "   - \(.key): \(.value.result)"
          ')
          if [ -n "$failed" ]; then
            echo "❌ Not successful:"
            echo "$failed"
            exit 1
          fi

          echo "✅ All checks passed!"
